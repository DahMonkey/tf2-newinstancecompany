modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SmileycorpMC/tf2-stuff-reloaded/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/rafradek_tf2_weapons/textures/icon.png"
authors="${mod_authors}"
credits="Valve, lundgren1957, grodax, Cipher_punk, The_Last_Dovahkiin, Wolfkann/Pikachiflame, WanderingSoulofTime"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
