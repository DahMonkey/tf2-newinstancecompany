name: Smoke test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
      - name: Prepare
        run: |
          chmod +x gradlew ci/smoke.sh
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:normal\n" > run/server.properties
      - name: Dedicated server
        run: ci/smoke.sh runServer 'Done \(' 60 1200 2>&1 | tee smoke-server.txt
        continue-on-error: true
      - name: Client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ci/smoke.sh runClient 'Sound engine started|Created: .*atlas' 90 1500 2>&1 | tee smoke-client.txt
        continue-on-error: true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke-*.log
            smoke-*.txt
            run/logs/*.log
            run/crash-reports/*.txt
